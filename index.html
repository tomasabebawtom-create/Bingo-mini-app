<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Spin Win</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg1:#1c1140; --bg2:#2b1a5e; --bg3:#150c30;
    --gold:#f5c542; --gold-dim:#8a6d1f;
    --red:#e0501f; --red2:#c94418;
    --black:#241455; --black2:#150c30;
    --green:#18b673; --blue:#3a63e0;
    --text:#f4f0ff; --text-dim:#b9aee0;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;font-family:'Segoe UI',system-ui,sans-serif;}
  body{
    background:
      radial-gradient(circle at 20% 0%, #3a2470 0%, transparent 55%),
      radial-gradient(circle at 100% 100%, #241455 0%, transparent 50%),
      linear-gradient(180deg, var(--bg1), var(--bg3));
    color:var(--text); min-height:100vh; overflow-x:hidden;
  }
  .wrap{padding:16px 14px 40px; max-width:480px; margin:0 auto;}

  .topbar{display:flex; align-items:center; gap:10px; padding:6px 2px 14px;}
  .logo{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffd76b,#e0501f);
    display:flex;align-items:center;justify-content:center;font-weight:800;color:#2b1140;font-size:18px;
    box-shadow:0 0 0 2px var(--gold), 0 4px 10px rgba(0,0,0,.4);}
  .brand{font-size:19px;font-weight:800;letter-spacing:.3px;}
  .brand span{color:var(--gold);}

  .wallet-row{display:flex; gap:8px; margin-bottom:16px;}
  .wallet-chip{flex:1; background:linear-gradient(160deg,#2c1c5c,#1c1140); border:1px solid #4b3496;
    border-radius:14px; padding:10px 8px; text-align:center;}
  .wallet-chip .label{font-size:11px; color:var(--text-dim); margin-bottom:2px;}
  .wallet-chip .value{font-size:18px; font-weight:800; color:var(--gold);}

  #wheel-wrapper{position:relative; width:280px; height:280px; margin:14px auto 20px;
    filter:drop-shadow(0 14px 22px rgba(0,0,0,.55));}
  /* outer bezel: chrome/gold ring, like a real casino wheel rim */
  #wheel-bezel{position:absolute; inset:-10px; border-radius:50%;
    background:conic-gradient(from 0deg, #fff8dc, #c99b1f, #fff8dc, #8a6d1f, #fff8dc, #c99b1f, #fff8dc);
    box-shadow:inset 0 0 0 3px rgba(0,0,0,.35), 0 0 0 2px rgba(0,0,0,.4);}
  #wheel-bezel::after{content:''; position:absolute; inset:9px; border-radius:50%;
    background:radial-gradient(circle at 35% 25%, #2a2a2a, #0a0a0a 70%);}
  /* top LED progress arc — purely decorative, echoes the reference image */
  #top-arc{position:absolute; top:-9px; left:50%; transform:translateX(-50%); width:150px; height:26px;
    overflow:hidden; z-index:6; pointer-events:none;}
  #top-arc svg{width:150px; height:52px; display:block;}
  #pointer{position:absolute; top:-6px; left:50%; transform:translateX(-50%); width:0; height:0;
    border-left:11px solid transparent; border-right:11px solid transparent; border-top:20px solid var(--gold); z-index:7;
    filter:drop-shadow(0 3px 5px rgba(0,0,0,.6));}
  #wheel-container{width:280px; height:280px; border-radius:50%; position:relative;
    transition:transform 5.2s cubic-bezier(0.10,0.68,0.08,1); overflow:hidden;
    box-shadow:inset 0 0 22px rgba(0,0,0,.65), inset 0 0 0 2px rgba(0,0,0,.5);}
  #wheel-container svg{width:100%; height:100%; display:block;}
  #hub{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:82px; height:82px;
    background:radial-gradient(circle at 35% 28%,#5a6fd8,#2438a8 55%,#141d5e); border-radius:50%;
    display:flex; align-items:center; justify-content:center; flex-direction:column; z-index:4;
    box-shadow:0 0 0 4px #d9c98a, 0 0 0 6px rgba(0,0,0,.5), inset 0 3px 8px rgba(255,255,255,.25), inset 0 -6px 10px rgba(0,0,0,.5);}
  #hub .htxt{font-weight:900; color:#fff; font-size:12px; letter-spacing:.5px; line-height:1.25; text-align:center;
    text-shadow:0 1px 2px rgba(0,0,0,.6);}

  .result-line{min-height:26px; text-align:center; font-weight:800; font-size:15px; margin-bottom:6px;}
  .result-line.win{color:var(--gold);}
  .result-line.lose{color:var(--text-dim);}

  .stake-box{background:linear-gradient(160deg,rgba(245,197,66,.12),rgba(245,197,66,.02));
    border:1px solid var(--gold-dim); border-radius:18px; padding:16px; margin-bottom:14px;}
  .stake-box .title{display:flex; align-items:center; gap:6px; color:var(--gold); font-weight:700; margin-bottom:12px; font-size:14px;}
  .row-btns{display:flex; gap:8px; margin-bottom:10px;}
  .row-btns.three .chip-btn{font-size:12px; padding:10px 2px; line-height:1.5;}
  .row-btns.three .chip-btn small{display:block; font-weight:700; font-size:10px; color:var(--text-dim); margin-top:2px;}
  .row-btns.three .chip-btn.active small{color:var(--gold);}
  .chip-btn{flex:1; border:2px solid #4b3496; background:#221351; color:var(--text); border-radius:12px;
    padding:12px 4px; font-weight:800; font-size:14px; cursor:pointer;}
  .chip-btn.active{border-color:var(--gold); box-shadow:0 0 0 1px var(--gold); color:var(--gold);}
  .chip-btn.on-red{border-color:var(--red);} .chip-btn.on-red.active{background:linear-gradient(90deg,var(--red),var(--red2)); color:#fff; border-color:var(--gold);}
  .chip-btn.on-black{border-color:#3a2670;} .chip-btn.on-black.active{background:linear-gradient(160deg,var(--black),var(--black2)); color:#fff; border-color:var(--gold);}

  .num-toggle{width:100%; text-align:center; padding:10px; border-radius:12px; border:2px dashed #4b3496;
    color:var(--text-dim); font-weight:700; font-size:13px; margin-bottom:10px; cursor:pointer; background:transparent;}
  .num-toggle.active{border-style:solid; border-color:var(--gold); color:var(--gold);}
  #number-grid{display:none; grid-template-columns:repeat(6,1fr); gap:6px; margin-bottom:10px;}
  #number-grid.show{display:grid;}
  .num-btn{background:#1e1440; border:2px solid #3a2670; color:#fff; border-radius:8px; padding:9px 0;
    font-size:13px; font-weight:800; cursor:pointer;}
  .num-btn.red{border-color:var(--red);} .num-btn.black{border-color:#4b3496;} .num-btn.green{border-color:var(--green);}
  .num-btn.selected{background:var(--gold); color:#2b1140; border-color:var(--gold);}

  .spin-cost{text-align:center; color:var(--text-dim); font-size:12px; margin-top:4px;}
  .spin-cost b{color:var(--gold);}

  .confirm-btn{width:100%; border:none; border-radius:14px; padding:16px; margin-top:14px;
    font-size:17px; font-weight:800; color:#2b1140; background:linear-gradient(90deg,var(--gold),#e0a92f);
    box-shadow:0 6px 16px rgba(245,197,66,.35); cursor:pointer;}
  .confirm-btn:disabled{opacity:.4;}

  .msg{position:fixed; top:14px; left:50%; transform:translateX(-50%); background:#2b1140; border:1px solid var(--gold);
    color:var(--text); padding:10px 18px; border-radius:12px; font-size:13px; font-weight:700; z-index:50; display:none;
    box-shadow:0 6px 16px rgba(0,0,0,.4); max-width:88%; text-align:center;}
</style>
</head>
<body>

<div class="msg" id="msg"></div>

<div class="wrap">
  <div class="topbar">
    <div class="logo">S</div>
    <div class="brand">Spin <span>Win</span></div>
  </div>

  <div class="wallet-row">
    <div class="wallet-chip"><div class="label">ሂሳብ</div><div class="value" id="walletBalance">–</div></div>
    <div class="wallet-chip"><div class="label">ውርርድ ዋጋ</div><div class="value" id="walletStake">10</div></div>
  </div>

  <div id="wheel-wrapper">
    <div id="wheel-bezel"></div>
    <div id="top-arc">
      <svg viewBox="0 0 150 52"><path d="M15,50 A60,60 0 0 1 135,50" fill="none" stroke="#3a63e0" stroke-width="4" stroke-linecap="round"/></svg>
    </div>
    <div id="pointer"></div>
    <div id="wheel-container">
      <svg id="wheel-svg" viewBox="0 0 300 300"></svg>
    </div>
    <div id="hub"><div class="htxt">SPIN<br>WIN</div></div>
  </div>
  <div class="result-line" id="resultLine"></div>

  <div class="stake-box">
    <div class="title">▷ ውርርድ ምረጥ</div>
    <div class="row-btns">
      <button class="chip-btn on-red" id="betRed" onclick="setBetType('red')">ቀይ Red</button>
      <button class="chip-btn on-black" id="betBlack" onclick="setBetType('black')">ጥቁር Black</button>
    </div>
    <div class="row-btns">
      <button class="chip-btn" id="betOdd" onclick="setBetType('odd')">ጎዶሎ Odd</button>
      <button class="chip-btn" id="betEven" onclick="setBetType('even')">ጥምዝ Even</button>
    </div>
    <div class="row-btns">
      <button class="chip-btn" id="betLow" onclick="setBetType('low')">1–18</button>
      <button class="chip-btn" id="betHigh" onclick="setBetType('high')">19–36</button>
    </div>
    <div class="row-btns three">
      <button class="chip-btn" id="betDozen1" onclick="setBetType('dozen1')">1ኛ ደርዘን<br><small>1–12 · 3x</small></button>
      <button class="chip-btn" id="betDozen2" onclick="setBetType('dozen2')">2ኛ ደርዘን<br><small>13–24 · 3x</small></button>
      <button class="chip-btn" id="betDozen3" onclick="setBetType('dozen3')">3ኛ ደርዘን<br><small>25–36 · 3x</small></button>
    </div>
    <div class="row-btns three">
      <button class="chip-btn" id="betCol1" onclick="setBetType('col1')">ዓምድ 1<br><small>3x</small></button>
      <button class="chip-btn" id="betCol2" onclick="setBetType('col2')">ዓምድ 2<br><small>3x</small></button>
      <button class="chip-btn" id="betCol3" onclick="setBetType('col3')">ዓምድ 3<br><small>3x</small></button>
    </div>
    <button class="num-toggle" id="numToggle" onclick="toggleNumberGrid()">🎯 በተለየ ቁጥር ላይ ውረድ (36x)</button>
    <div id="number-grid"></div>
    <div class="spin-cost">እያንዳንዱ ስፒን <b id="spinCostLabel">10</b> ብር ያስከፍላል</div>
  </div>

  <button class="confirm-btn" id="spinBtn" onclick="spinWheel()">🎡 አዙር (SPIN)</button>
</div>

<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }
const initData = (tg && tg.initData) ? tg.initData : '';

function toast(t){
  const m=document.getElementById('msg'); m.textContent=t; m.style.display='block';
  clearTimeout(window._mt); window._mt=setTimeout(()=>m.style.display='none',2600);
}

/* ---------- state ---------- */
let betType = 'red';       // 'red' | 'black' | 'odd' | 'even' | 'number'
let betValue = null;       // used only when betType === 'number'
let balance = 0;
let spinning = false;
const SPIN_COST = 10; // matches server-side SPIN_COST

/* ---------- wallet ---------- */
async function refreshBalance(){
  try{
    const resp = await fetch(`/api/balance?initData=${encodeURIComponent(initData)}`);
    const data = await resp.json();
    balance = data.balance ?? 0;
    document.getElementById('walletBalance').textContent = balance;
  }catch(e){
    document.getElementById('walletBalance').textContent = '–';
  }
}
refreshBalance();
document.getElementById('walletStake').textContent = SPIN_COST;
document.getElementById('spinCostLabel').textContent = SPIN_COST;

/* ---------- bet type ---------- */
const ALL_BET_IDS = ['betRed','betBlack','betOdd','betEven','betLow','betHigh',
  'betDozen1','betDozen2','betDozen3','betCol1','betCol2','betCol3'];
const BET_ID_MAP = {
  red:'betRed', black:'betBlack', odd:'betOdd', even:'betEven',
  low:'betLow', high:'betHigh',
  dozen1:'betDozen1', dozen2:'betDozen2', dozen3:'betDozen3',
  col1:'betCol1', col2:'betCol2', col3:'betCol3',
};
function setBetType(type){
  betType = type;
  betValue = null;
  document.getElementById('number-grid').classList.remove('show');
  document.getElementById('numToggle').classList.remove('active');
  ALL_BET_IDS.forEach(id=>document.getElementById(id).classList.remove('active'));
  if (BET_ID_MAP[type]) document.getElementById(BET_ID_MAP[type]).classList.add('active');
}
setBetType('red');

function toggleNumberGrid(){
  const grid = document.getElementById('number-grid');
  const on = !grid.classList.contains('show');
  grid.classList.toggle('show', on);
  document.getElementById('numToggle').classList.toggle('active', on);
  if (on){
    betType = 'number';
    betValue = betValue ?? 0;
    ALL_BET_IDS.forEach(id=>document.getElementById(id).classList.remove('active'));
  }
}

const RED_NUMBERS = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
function colorFor(n){ if(n===0) return 'green'; return RED_NUMBERS.has(n) ? 'red' : 'black'; }
function hexFor(n){ const c=colorFor(n); return c==='green' ? '#18b673' : c==='red' ? '#e0501f' : '#241455'; }

const grid = document.getElementById('number-grid');
for (let n=0; n<=36; n++){
  const btn = document.createElement('button');
  btn.className = 'num-btn ' + colorFor(n);
  btn.textContent = n;
  btn.onclick = ()=>{
    betType = 'number'; betValue = n;
    document.querySelectorAll('.num-btn').forEach(b=>b.classList.remove('selected'));
    btn.classList.add('selected');
  };
  grid.appendChild(btn);
}

/* ---------- wheel drawing ---------- */
const WHEEL_ORDER = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
const svg = document.getElementById('wheel-svg');
const CX=150, CY=150, R=148;
const segAngle = 360 / WHEEL_ORDER.length;
function polar(cx,cy,r,angleDeg){ const rad=(angleDeg-90)*Math.PI/180; return {x:cx+r*Math.cos(rad), y:cy+r*Math.sin(rad)}; }
const svgNS = "http://www.w3.org/2000/svg";
// dark hub-facing ring (segments only occupy the outer band, like a real wheel)
const INNER_R = R*0.42;
WHEEL_ORDER.forEach((num,i)=>{
  const startAngle=i*segAngle, endAngle=startAngle+segAngle;
  const mid=startAngle+segAngle/2;

  // wedge (outer band only, leaving a dark ring near the hub)
  const po1=polar(CX,CY,R,startAngle), po2=polar(CX,CY,R,endAngle);
  const pi1=polar(CX,CY,INNER_R,endAngle), pi2=polar(CX,CY,INNER_R,startAngle);
  const largeArc = segAngle>180 ? 1:0;
  const path=document.createElementNS(svgNS,"path");
  path.setAttribute("d",
    `M${po1.x},${po1.y} A${R},${R} 0 ${largeArc} 1 ${po2.x},${po2.y} L${pi1.x},${pi1.y} A${INNER_R},${INNER_R} 0 ${largeArc} 0 ${pi2.x},${pi2.y} Z`);
  path.setAttribute("fill", hexFor(num));
  path.setAttribute("stroke", "#0a0714");
  path.setAttribute("stroke-width", "1.5");
  svg.appendChild(path);

  // gold dash ticks lining each wedge (decorative, like the reference wheel)
  const dashCount = 3 + (i % 3);
  for (let d=0; d<dashCount; d++){
    const t = 0.18 + (d/(dashCount-1||1))*0.58;
    const dashR = INNER_R + t*(R-INNER_R);
    const dpos = polar(CX,CY,dashR,mid);
    const dash=document.createElementNS(svgNS,"rect");
    dash.setAttribute("x", -3.5); dash.setAttribute("y", -1.6);
    dash.setAttribute("width", 7); dash.setAttribute("height", 3.2);
    dash.setAttribute("rx", 0.8);
    dash.setAttribute("fill", "#f5c542");
    dash.setAttribute("opacity", "0.85");
    dash.setAttribute("transform", `translate(${dpos.x},${dpos.y}) rotate(${mid+90})`);
    svg.appendChild(dash);
  }

  // number label near the outer rim
  const labelPos=polar(CX,CY,R*0.90,mid);
  const text=document.createElementNS(svgNS,"text");
  text.setAttribute("x", labelPos.x); text.setAttribute("y", labelPos.y);
  text.setAttribute("fill","#ffffff"); text.setAttribute("font-size","12"); text.setAttribute("font-weight","900");
  text.setAttribute("text-anchor","middle"); text.setAttribute("dominant-baseline","middle");
  text.setAttribute("transform", `rotate(${mid}, ${labelPos.x}, ${labelPos.y})`);
  text.textContent = num;
  svg.appendChild(text);
});
// thin dark hub ring behind the center hub so the inner cut looks intentional
const hubRing=document.createElementNS(svgNS,"circle");
hubRing.setAttribute("cx",CX); hubRing.setAttribute("cy",CY); hubRing.setAttribute("r",INNER_R);
hubRing.setAttribute("fill","#0a0714");
svg.insertBefore(hubRing, svg.firstChild);
svg.appendChild((()=>{ const c=document.createElementNS(svgNS,"circle");
  c.setAttribute("cx",CX); c.setAttribute("cy",CY); c.setAttribute("r",INNER_R);
  c.setAttribute("fill","none"); c.setAttribute("stroke","#f5c542"); c.setAttribute("stroke-width","2"); c.setAttribute("opacity","0.5");
  return c; })());

/* ---------- spin flow: server decides FIRST, then we animate to it ---------- */
let currentRotation = 0;

async function spinWheel(){
  if (spinning) return;
  if (betType === 'number' && betValue === null){
    toast('⚠️ እባክዎ ቁጥር ይምረጡ!');
    return;
  }
  if (balance < SPIN_COST){
    toast('❌ በቂ ሂሳብ የለዎትም');
    return;
  }

  spinning = true;
  document.getElementById('spinBtn').disabled = true;
  document.getElementById('resultLine').textContent = '';
  document.getElementById('resultLine').className = 'result-line';

  let data;
  try{
    const resp = await fetch('/api/spin-win', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ initData, betType, betValue })
    });
    data = await resp.json();
    if (!resp.ok){
      toast(data.error || '❌ ስህተት ተፈጥሯል');
      spinning = false;
      document.getElementById('spinBtn').disabled = false;
      return;
    }
  }catch(e){
    toast('❌ ከሰርቨሩ ጋር መገናኘት አልተቻለም');
    spinning = false;
    document.getElementById('spinBtn').disabled = false;
    return;
  }

  const winningNumber = data.winning_number;
  const winningIndex = WHEEL_ORDER.indexOf(winningNumber);
  const targetAngle = winningIndex * segAngle + segAngle/2;
  const fullSpins = 7 * 360;
  const finalRotation = fullSpins - targetAngle;
  currentRotation += finalRotation - (currentRotation % 360);

  const wheel = document.getElementById('wheel-container');
  wheel.style.transform = `rotate(${currentRotation}deg)`;
  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

  setTimeout(()=>{
    spinning = false;
    document.getElementById('spinBtn').disabled = false;
    balance = data.balance;
    document.getElementById('walletBalance').textContent = balance;

    const line = document.getElementById('resultLine');
    const colorLabel = data.winning_color === 'red' ? 'ቀይ' : data.winning_color === 'black' ? 'ጥቁር' : 'አረንጓዴ';
    if (data.won){
      line.textContent = `🎉 ${winningNumber} (${colorLabel}) ወጣ — ${data.amount} አሸንፈዋል!`;
      line.classList.add('win');
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    } else {
      line.textContent = `😔 ${winningNumber} (${colorLabel}) ወጣ — እንደገና ይሞክሩ`;
      line.classList.add('lose');
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
    }
  }, 5300);
}
</script>
</body>
</html>
