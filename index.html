<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin and Win Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        #wheel-container {
            margin: 30px auto;
            position: relative;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            border: 10px solid #fbbf24;
            display: flex;
            align-items: center;
            justify-content: center;
            background: conic-gradient(
                #ef4444 0deg 60deg,
                #3b82f6 60deg 120deg,
                #10b981 120deg 180deg,
                #f59e0b 180deg 240deg,
                #8b5cf6 240deg 300deg,
                #ec4899 300deg 360deg
            );
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
        }
        button {
            background-color: #fbbf24;
            color: #000;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <h1>🎡 Spin & Win</h1>
    <p id="user-greeting">እንኳን ደህና መጡ!</p>

    <div id="wheel-container"></div>
    
    <button onclick="spinWheel()">አዙር (SPIN)</button>
    <h2 id="result"></h2>

    <script>
        // የቴሌግራም ዌብ አፕ ማቀናጀት
        let tg = window.Telegram.WebApp;
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            let username = tg.initDataUnsafe.user.first_name;
            document.getElementById("user-greeting").innerText = `ሰላም ${username}፣ ዕድልዎን ይሞክሩ!`;
        }

        let currentRotation = 0;

        function spinWheel() {
            const wheel = document.getElementById("wheel-container");
            const resultText = document.getElementById("result");
            
            resultText.innerText = "እየተሽከረከረ ነው...";

            // የዘፈቀደ የማዞሪያ ዲግሪ (ከ 3 እስከ 5 ሙሉ ዙር በተጨማሪ የተወሰነ ዕድል)
            let randomDegree = Math.floor(Math.random() * 3600) + 720;
            currentRotation += randomDegree;
            
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                resultText.innerText = "እንኳን ደስ አለዎት! 10 ነጥብ አሸንፈዋል! 🎉";
                // ውጤቱን ወደ ቦት ወይም ዳታቤዝ መላክ ይቻላል
            }, 4000);
        }
    </script>
</body>
</html>
