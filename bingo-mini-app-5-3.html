<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ቢንጎ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://bingo-mini-app-0qh7.onrender.com/socket.io/socket.io.js"></script>
<style>
  :root{
    --bg1:#1c1140; --bg2:#2b1a5e; --bg3:#150c30;
    --gold:#f5c542; --gold-dim:#8a6d1f;
    --cell:#e0501f; --cell2:#c94418;
    --called:#2b1740; --called-border:#7a5bd6;
    --green:#18b673; --blue:#3a63e0;
    --text:#f4f0ff; --text-dim:#b9aee0;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;font-family:'Segoe UI',system-ui,sans-serif;}
  body{
    background:
      radial-gradient(circle at 20% 0%, #3a2470 0%, transparent 55%),
      radial-gradient(circle at 100% 100%, #241455 0%, transparent 50%),
      linear-gradient(180deg, var(--bg1), var(--bg3));
    color:var(--text); min-height:100vh; overflow-x:hidden;
  }
  .screen{display:none; padding:16px 14px 90px; max-width:480px; margin:0 auto;}
  .screen.active{display:block;}

  /* header */
  .topbar{display:flex; align-items:center; gap:10px; padding:6px 2px 14px;}
  .logo{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffd76b,#e0501f);
    display:flex;align-items:center;justify-content:center;font-weight:800;color:#2b1140;font-size:18px;
    box-shadow:0 0 0 2px var(--gold), 0 4px 10px rgba(0,0,0,.4);}
  .brand{font-size:19px;font-weight:800;letter-spacing:.3px;}
  .brand span{color:var(--gold);}

  /* wallet strip */
  .wallet-row{display:flex; gap:8px; margin-bottom:16px;}
  .wallet-chip{flex:1; background:linear-gradient(160deg,#2c1c5c,#1c1140); border:1px solid #4b3496;
    border-radius:14px; padding:10px 8px; text-align:center;}
  .wallet-chip .label{font-size:11px; color:var(--text-dim); margin-bottom:2px;}
  .wallet-chip .value{font-size:18px; font-weight:800; color:var(--gold);}

  h1.hero{font-size:26px; text-align:center; margin:6px 0 4px; font-weight:800;}
  h1.hero span{color:var(--gold);}
  p.sub{text-align:center; color:var(--text-dim); font-size:13px; margin:0 0 20px;}

  .stake-box{background:linear-gradient(160deg,rgba(245,197,66,.12),rgba(245,197,66,.02));
    border:1px solid var(--gold-dim); border-radius:18px; padding:16px; margin-bottom:18px;}
  .stake-box .title{display:flex; align-items:center; gap:6px; color:var(--gold); font-weight:700; margin-bottom:12px; font-size:14px;}
  .stake-btn{width:100%; border:none; border-radius:12px; padding:16px; font-size:17px; font-weight:800;
    color:#fff; margin-bottom:10px; display:flex; align-items:center; justify-content:center; gap:8px;
    box-shadow:0 6px 14px rgba(0,0,0,.35); cursor:pointer;}
  .stake-btn.a{background:linear-gradient(90deg,#18b673,#0d8a58);}
  .stake-btn.b{background:linear-gradient(90deg,#3a63e0,#1f3fae);}
  .stake-btn.c{background:linear-gradient(90deg,#e0501f,#b93c12);}

  .stats-row{display:flex; gap:10px; margin-top:6px;}
  .stat-card{flex:1; background:#1c1140; border:1px solid #3a2670; border-radius:14px; padding:14px 8px; text-align:center;}
  .stat-card .num{font-size:20px; font-weight:800; color:var(--gold);}
  .stat-card .lab{font-size:11px; color:var(--text-dim); margin-top:2px;}

  /* cartela / picker screen */
  .picker-top{display:flex; gap:10px; margin-bottom:12px;}
  .pill{flex:1; background:#221351; border:1px solid #4b3496; border-radius:12px; padding:8px 10px; text-align:center;}
  .pill .l{font-size:10px; color:var(--text-dim);}
  .pill .v{font-size:16px; font-weight:800;}
  .timer-pill{background:linear-gradient(160deg,#e0501f,#a8330f); min-width:64px;}
  .timer-pill .v{color:#fff;}

  .grid{display:grid; grid-template-columns:repeat(8,1fr); gap:7px;}
  .cell{aspect-ratio:1; border-radius:10px; display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:15px; color:#fff; background:linear-gradient(160deg,var(--cell),var(--cell2));
    box-shadow:0 3px 6px rgba(0,0,0,.35); border:2px solid transparent; cursor:pointer; user-select:none;}
  .cell.taken{background:var(--called); border-color:var(--called-border); color:var(--text-dim);}
  .cell.selected{border-color:var(--gold); box-shadow:0 0 0 2px var(--gold), 0 3px 10px rgba(245,197,66,.5);}

  .confirm-bar{position:fixed; left:0; right:0; bottom:0; padding:12px 14px 18px; background:linear-gradient(0deg,var(--bg3) 60%, transparent);}
  .confirm-btn{max-width:452px; margin:0 auto; display:block; width:100%; border:none; border-radius:14px; padding:16px;
    font-size:17px; font-weight:800; color:#2b1140; background:linear-gradient(90deg,var(--gold),#e0a92f);
    box-shadow:0 6px 16px rgba(245,197,66,.35); cursor:pointer;}
  .confirm-btn:disabled{opacity:.4;}

  /* game screen */
  .game-top{display:flex; gap:6px; margin-bottom:12px;}
  .g-chip{flex:1; background:#221351; border:1px solid #4b3496; border-radius:12px; padding:7px 4px; text-align:center;}
  .g-chip .l{font-size:9px; color:var(--text-dim);}
  .g-chip .v{font-size:14px; font-weight:800; color:var(--gold);}

  .layout{display:flex; gap:10px;}
  .board{flex:1.15;}
  .letters{display:grid; grid-template-columns:repeat(5,1fr); gap:5px; margin-bottom:5px;}
  .letter{text-align:center; font-weight:800; border-radius:8px; padding:6px 0; color:#fff; font-size:13px;}
  .letter.B{background:#3a63e0;} .letter.I{background:#7a4fe0;} .letter.N{background:#c23fd6;}
  .letter.G{background:#18b673;} .letter.O{background:#e0501f;}
  .numcol{display:grid; grid-template-columns:repeat(5,1fr); gap:5px;}
  .num{aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:7px;
    font-size:12px; font-weight:700; background:#241455; color:var(--text-dim); border:1px solid #3a2670;}
  .num.called{background:linear-gradient(160deg,var(--gold),#c99b1f); color:#2b1140; border-color:var(--gold);}
  .num.marked{background:linear-gradient(160deg,var(--green),#0d8a58); color:#fff; border-color:var(--green);}

  .side{flex:1; display:flex; flex-direction:column; gap:10px;}
  .call-panel{background:linear-gradient(160deg,#241455,#150c30); border:1px solid #4b3496; border-radius:16px; padding:14px; text-align:center;}
  .call-panel .lastcall{font-size:13px; color:var(--text-dim); margin-bottom:6px;}
  .ball{width:96px; height:96px; margin:0 auto; border-radius:50%; display:flex; flex-direction:column;
    align-items:center; justify-content:center; background:radial-gradient(circle at 35% 30%,#fff,#f5c542 55%,#c99b1f);
    color:#2b1140; font-weight:900; box-shadow:0 0 0 4px rgba(245,197,66,.25), 0 8px 20px rgba(0,0,0,.4);}
  .ball .bl{font-size:14px;} .ball .bn{font-size:26px; line-height:1;}

  .mycard-wrap{background:#150c30; border:1px solid #3a2670; border-radius:14px; padding:10px;}
  .mycard-wrap .t{font-size:11px; color:var(--text-dim); text-align:center; margin-bottom:8px;}

  .action-row{display:flex; gap:8px; margin-top:auto;}
  .action-btn{flex:1; border:none; border-radius:12px; padding:13px 4px; font-weight:800; font-size:13px; color:#fff; cursor:pointer;}
  .action-btn.bingo{background:linear-gradient(90deg,var(--gold),#e0a92f); color:#2b1140;}
  .action-btn.leave{background:linear-gradient(90deg,#c94418,#8f2d0e);}

  .msg{position:fixed; top:14px; left:50%; transform:translateX(-50%); background:#2b1140; border:1px solid var(--gold);
    color:var(--text); padding:10px 18px; border-radius:12px; font-size:13px; font-weight:700; z-index:50; display:none;
    box-shadow:0 6px 16px rgba(0,0,0,.4);}

  .winner-overlay{position:fixed; inset:0; background:rgba(10,5,25,.85); display:none; align-items:center; justify-content:center; z-index:60;}
  .winner-card{background:linear-gradient(160deg,#2c1c5c,#150c30); border:2px solid var(--gold); border-radius:20px;
    padding:30px 24px; text-align:center; max-width:320px;}
  .winner-card .t1{font-size:40px;} .winner-card .t2{font-size:20px; font-weight:800; color:var(--gold); margin:8px 0;}
  .winner-card .t3{font-size:14px; color:var(--text-dim); margin-bottom:18px;}
</style>
</head>
<body>

<div class="msg" id="msg"></div>

<!-- SCREEN 1: HOME / STAKE -->
<div class="screen active" id="screenHome">
  <div class="topbar">
    <div class="logo">B</div>
    <div class="brand">Betesab <span>Bingo</span></div>
  </div>

  <div class="wallet-row">
    <div class="wallet-chip"><div class="label">ሂሳብ</div><div class="value" id="walletMain">0</div></div>
    <div class="wallet-chip"><div class="label">Play Wallet</div><div class="value" id="walletPlay">0</div></div>
  </div>

  <h1 class="hero">Welcome to <span>Betesab</span> Bingo</h1>
  <p class="sub">የምትፈልገውን ስቴክ ምረጥ እና ጨዋታ ጀምር</p>

  <div class="stake-box">
    <div class="title">▷ Choose Your Stake</div>
    <button class="stake-btn a" onclick="chooseStake(10)">▷ Play 10</button>
    <button class="stake-btn b" onclick="chooseStake(20)">▷ Play 20</button>
    <button class="stake-btn c" onclick="chooseStake(50)">▷ Play 50</button>
  </div>

  <div class="stats-row">
    <div class="stat-card"><div class="num" id="statPlayers">–</div><div class="lab">Active Players</div></div>
    <div class="stat-card"><div class="num" id="statPot">–</div><div class="lab">Total Derash</div></div>
  </div>
</div>

<!-- SCREEN 2: CARTELA PICKER -->
<div class="screen" id="screenPicker">
  <div class="picker-top">
    <div class="pill"><div class="l">ስቴክ</div><div class="v" id="pickStake">10</div></div>
    <div class="pill"><div class="l">የተመረጠ</div><div class="v" id="pickSelected">–</div></div>
    <div class="pill timer-pill"><div class="l">ጨዋታ በ</div><div class="v" id="pickTimer">–</div></div>
  </div>
  <div class="grid" id="cartelaGrid"></div>
  <div class="confirm-bar">
    <button class="confirm-btn" id="confirmBtn" disabled onclick="confirmCard()">ካርድ ውሰድ እና ግባ</button>
  </div>
</div>

<!-- SCREEN 3: GAME -->
<div class="screen" id="screenGame">
  <div class="game-top">
    <div class="g-chip"><div class="l">Game ID</div><div class="v" id="gGameId">–</div></div>
    <div class="g-chip"><div class="l">Players</div><div class="v" id="gPlayers">–</div></div>
    <div class="g-chip"><div class="l">Bet</div><div class="v" id="gBet">–</div></div>
    <div class="g-chip"><div class="l">Derash</div><div class="v" id="gDerash">–</div></div>
    <div class="g-chip"><div class="l">Called</div><div class="v" id="gCalled">0</div></div>
  </div>

  <div class="layout">
    <div class="board">
      <div class="letters">
        <div class="letter B">B</div><div class="letter I">I</div><div class="letter N">N</div>
        <div class="letter G">G</div><div class="letter O">O</div>
      </div>
      <div class="mycard-wrap">
        <div class="t">የካርድህ ቁጥሮች</div>
        <div class="numcol" id="myCard"></div>
      </div>
    </div>

    <div class="side">
      <div class="call-panel">
        <div class="lastcall">የመጨረሻ ጥሪ</div>
        <div class="ball" id="ballDisplay"><div class="bl">–</div><div class="bn">–</div></div>
      </div>
      <div class="action-row">
        <button class="action-btn bingo" onclick="claimBingo()">🏆 BINGO</button>
        <button class="action-btn leave" onclick="leaveGame()">Leave</button>
      </div>
    </div>
  </div>
</div>

<div class="winner-overlay" id="winnerOverlay">
  <div class="winner-card">
    <div class="t1">🎉🏆🎉</div>
    <div class="t2" id="winnerName">–</div>
    <div class="t3">ቢንጎ አሸንፏል!</div>
    <button class="confirm-btn" style="position:static;" onclick="closeWinner()">እሺ</button>
  </div>
</div>

<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }
const playerName = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user)
  ? (tg.initDataUnsafe.user.first_name || 'ተጫዋች') : 'ተጫዋች';

const socket = io("https://bingo-mini-app-0qh7.onrender.com");
let selectedStake = 10;
let selectedCartela = null;
let myCardData = null;
let markedSet = new Set();
let calledSet = new Set();

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function toast(t){
  const m=document.getElementById('msg'); m.textContent=t; m.style.display='block';
  clearTimeout(window._mt); window._mt=setTimeout(()=>m.style.display='none',2200);
}

/* ---------- Screen 1: stake choose ---------- */
function chooseStake(v){
  selectedStake = v;
  document.getElementById('pickStake').textContent = v;
  buildCartelaGrid();
  showScreen('screenPicker');
}

/* ---------- Screen 2: cartela grid (1-100 visual card numbers) ---------- */
function buildCartelaGrid(){
  const grid = document.getElementById('cartelaGrid');
  grid.innerHTML = '';
  for(let i=1;i<=96;i++){
    const c = document.createElement('div');
    c.className = 'cell';
    c.textContent = i;
    c.dataset.n = i;
    c.onclick = ()=> selectCartela(i, c);
    grid.appendChild(c);
  }
}
function selectCartela(n, el){
  document.querySelectorAll('.cell.selected').forEach(x=>x.classList.remove('selected'));
  el.classList.add('selected');
  selectedCartela = n;
  document.getElementById('pickSelected').textContent = n;
  document.getElementById('confirmBtn').disabled = false;
}
function confirmCard(){
  socket.emit('joinGame', playerName);
  document.getElementById('gBet').textContent = selectedStake;
}

/* ---------- Socket events ---------- */
socket.on('yourCard', (card)=>{
  myCardData = card; // {B:[..],I:[..],N:[..],G:[..],O:[..]}
  markedSet = new Set();
  renderMyCard();
  showScreen('screenGame');
  toast('ካርድ ደርሶሃል — መልካም ዕድል!');
});

socket.on('calledSoFar', (nums)=>{
  calledSet = new Set(nums);
  renderMyCard();
});

socket.on('numberCalled', (data)=>{
  calledSet.add(data.number);
  document.getElementById('gCalled').textContent = data.calledNumbers ? data.calledNumbers.length : calledSet.size;
  document.getElementById('ballDisplay').innerHTML =
    `<div class="bl">${data.letter}</div><div class="bn">${data.number}</div>`;
  renderMyCard();
});

socket.on('bingoWinner', (data)=>{
  document.getElementById('winnerName').textContent = data.name + ' 🏆';
  document.getElementById('winnerOverlay').style.display = 'flex';
});

socket.on('bingoFalse', (data)=>{
  toast(data.message || 'ገና ቢንጎ የለም');
});

socket.on('gameOver', (data)=>{
  toast(data.message || 'ጨዋታው አልቋል');
});

function renderMyCard(){
  const wrap = document.getElementById('myCard');
  wrap.innerHTML = '';
  if(!myCardData) return;
  const letters = ['B','I','N','G','O'];
  for(let row=0; row<5; row++){
    for(let col=0; col<5; col++){
      const val = myCardData[letters[col]][row];
      const cell = document.createElement('div');
      cell.className = 'num';
      if(val === 'FREE'){
        cell.textContent = '★';
        cell.classList.add('marked');
      } else {
        cell.textContent = val;
        if(calledSet.has(val)) cell.classList.add('called');
        if(markedSet.has(val)) cell.classList.add('marked');
        cell.onclick = ()=>{
          if(calledSet.has(val)){
            markedSet.add(val);
            socket.emit('markNumber', val);
            renderMyCard();
          }
        };
      }
      wrap.appendChild(cell);
    }
  }
}

function claimBingo(){ socket.emit('claimBingo'); }
function leaveGame(){
  showScreen('screenHome');
  myCardData = null; markedSet = new Set(); calledSet = new Set();
}
function closeWinner(){
  document.getElementById('winnerOverlay').style.display = 'none';
  leaveGame();
}
</script>
</body>
</html>
